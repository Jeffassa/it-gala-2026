<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#e8b86b"/>
      <stop offset="100%" stop-color="#c89249"/>
    </linearGradient>
  </defs>
  <!-- Fond brun fonce du ticket, coins arrondis -->
  <rect width="64" height="64" rx="14" fill="#0e0606"/>
  <!-- Lettre G en italique elegant, evoque "Gala" -->
  <text x="50%" y="74%"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="900"
        font-size="52"
        fill="url(#gold)">G</text>
</svg>
